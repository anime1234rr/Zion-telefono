name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Reintentar el build/subida del APK aunque el tag ya exista'
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Crear y pushear el tag de versión
        id: tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          TAG="mobile-v${VERSION}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "El tag $TAG ya existe en el remoto, pero se fuerza el reintento del build (force=true)."
              echo "created=true" >> "$GITHUB_OUTPUT"
            else
              echo "El tag $TAG ya existe en el remoto, no hace falta crearlo ni recompilar."
              echo "created=false" >> "$GITHUB_OUTPUT"
            fi
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear el borrador de release
        if: steps.tag.outputs.created == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Ya existe una release para $TAG."
          else
            gh release create "$TAG" --draft --title "$TAG" --notes ""
          fi

  build:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Generar proyecto nativo Android
        run: npx expo prebuild -p android --no-install

      - name: Compilar APK release
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Subir APK a la release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          APK="Zion-${TAG}.apk"
          mv android/app/build/outputs/apk/release/app-release.apk "$APK"
          gh release upload "$TAG" "$APK" --clobber

      - name: Publicar la release (sacarla de estado borrador)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          gh release edit "$TAG" --draft=false

      - name: Verificar que la release publicada tenga el APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.tag.outputs.tag }}"
          ASSETS=$(gh release view "$TAG" --json assets -q '[.assets[].name] | join(", ")')
          echo "Assets publicados en $TAG: $ASSETS"
          if ! echo "$ASSETS" | grep -q "\.apk"; then
            echo "::error::La release $TAG no tiene el .apk adjunto. Publicación incompleta, revisar manualmente en GitHub Releases."
            exit 1
          fi
